<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来科技 | 探索无限可能</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 背景 Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
            background: rgba(10, 10, 12, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: #a0a0aa;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        nav a:hover {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* 主体内容区域 */
        main {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 150px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 英雄横幅（Hero Section） */
        .hero {
            text-align: center;
            margin-bottom: 80px;
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 30%, #a0a0aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h1 span {
            background: linear-gradient(45deg, #ff007f, #7928ca, #00f2fe);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 5s linear infinite;
        }

        .hero p {
            font-size: 18px;
            color: #8e8e93;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        /* 炫酷按钮 */
        .cta-btn {
            position: relative;
            display: inline-block;
            padding: 15px 40px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 50px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }

        /* 卡片网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
        }

        /* 磨砂玻璃卡片 */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(20px);
            transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1);
        }

        .card .icon {
            font-size: 32px;
            margin-bottom: 20px;
            color: #00f2fe;
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card p {
            color: #8e8e93;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 动画定义 */
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            header { padding: 20px; }
            nav { display: none; } /* 移动端简易处理 */
            .hero h1 { font-size: 40px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 动态粒子背景 -->
    <canvas id="bg-canvas"></canvas>

    <!-- 导航栏 -->
    <header>
        <div class="logo">NEXT.GEN</div>
        <nav>
            <a href="#home">首页</a>
            <a href="#services">核心</a>
            <a href="#about">关于</a>
            <a href="#contact">联络</a>
        </nav>
    </header>

    <!-- 主体区域 -->
    <main>
        <!-- 英雄流光标语 -->
        <section class="hero" id="home">
            <h1>打造数字时代的<br><span>极致视觉体验</span></h1>
            <p>融合前沿技术与美学设计，为您呈现突破想象的交互空间。点击下方按钮，开启未来之旅。</p>
            <a href="#" class="cta-btn">立即启航</a>
        </section>

        <!-- 特性展示网格 -->
        <section class="grid" id="services">
            <div class="card">
                <div class="icon">✦</div>
                <h3>高效性能</h3>
                <p>采用轻量化架构，提供极速的加载响应与流畅的行动端交互体验。</p>
            </div>
            <div class="card">
                <div class="icon">🚀</div>
                <h3>前沿视觉</h3>
                <p>动态流光与数字化粒子背景相结合，彰显独特的科技感与未来感。</p>
            </div>
            <div class="card">
                <div class="icon">⚡</div>
                <h3>响应式设计</h3>
                <p>完美适配从智能手机到超宽视网膜屏幕的各类终端设备显示。</p>
            </div>
        </section>
    </main>

    <script>
        // 动态粒子背景脚本
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const numParticles = 80;
        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 242, 254, 0.3)';
                ctx.fill();
            }
        }

        // 初始化粒子
        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        // 连线函数
        function drawLines() {
            for (let i = 0; i < numParticles; i++) {
                for (let j = i + 1; j < numParticles; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawLines();
            requestAnimationFrame(animate);
        }

        animate();

        // 窗口尺寸调整监听
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
