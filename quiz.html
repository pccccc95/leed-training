    function loadQuestion() {
        hasAnswered = false;
        nextBtn.style.display = 'none';
        optionsContainer.innerHTML = '';

        const currentQuiz = quizData[currentQuestionIndex];
        
        progressEl.innerText = `进度：${currentQuestionIndex + 1} / ${quizData.length}`;
        questionEl.innerText = currentQuiz.question;
        
        // 动态同步更新跳转输入框中的数值
        if (jumpInput) {
            jumpInput.value = currentQuestionIndex + 1;
        }

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.classList.add('option-btn');
            button.innerText = option;
            button.addEventListener('click', () => selectOption(button, index));
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedBtn, selectedIndex) {
        if (hasAnswered) return; 
        hasAnswered = true;

        const currentQuiz = quizData[currentQuestionIndex];
        const correctIndex = currentQuiz.answer;
        const allButtons = optionsContainer.querySelectorAll('.option-btn');

        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            score++;
            correctCountEl.innerText = score; // 实时更新正确数
        } else {
            selectedBtn.classList.add('wrong');
            allButtons[correctIndex].classList.add('correct');
            wrongCount++;
            wrongCountEl.innerText = wrongCount; // 实时更新错误数
        }

        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

        const targetValue = parseInt(jumpInput.value, 10);
        
        // 验证输入是否为合法数字以及是否超出题目范围
        if (isNaN(targetValue) || targetValue < 1 || targetValue > quizData.length) {
            alert(`请输入 1 到 ${quizData.length} 之间的有效题号。`);
            jumpInput.value = currentQuestionIndex + 1;
            return;
        }
        
        // 切换至目标索引并加载题目
        currentQuestionIndex = targetValue - 1;
        loadQuestion();
    }

    function showResult() {
        quizBox.innerHTML = `
            <div class="result-container">
                <h2>答题结束</h2>
                <div class="score">最终正确率：${score} / ${quizData.length} (${Math.round((score / quizData.length) * 100)}%)</div>
                <p>总正确数：${score} | 总错误数：${wrongCount}</p>
                <button class="restart-btn" onclick="restartQuiz()">重新挑战</button>
            </div>
        `;
    }

    function restartQuiz() {
        window.location.reload();
    }

    if (quizData.length > 0) {
        loadQuestion();
    } else {
        progressEl.innerText = "暂无题目数据";
    }
</script>

</body>
</html>
